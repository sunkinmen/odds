name: nba-sync
on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: nba-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save cheerio@1.0.0
      - run: node nba_sync.mjs
      - name: commit
        run: |
          git config user.name "nba-sync"
          git config user.email "nba-sync@users.noreply.github.com"
          git add data/nba_live.json data/nba_raw.json
          git diff --cached --quiet || (git commit -m "nba data update" && git pull --rebase -q && git push)
